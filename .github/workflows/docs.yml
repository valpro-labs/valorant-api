name: Deploy Documentation

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Build site (with GitHub Pages basePath)
        if: github.ref == 'refs/heads/main'
        env:
          NEXT_PUBLIC_BASE_PATH: /valorant-api
        run: npm run build
      - name: Build site (preview, no basePath)
        if: github.ref != 'refs/heads/main'
        run: npm run build
      - name: Upload downloadable preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: website/out
          retention-days: 14
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: website/out

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
